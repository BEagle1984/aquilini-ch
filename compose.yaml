services:
  preview:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8080}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./resume.html:/usr/share/nginx/html/resume.html:ro
      - ./menu.html:/usr/share/nginx/html/menu.html:ro
      - ./styles:/usr/share/nginx/html/styles:ro
      - ./scripts:/usr/share/nginx/html/scripts:ro
      - ./fonts:/usr/share/nginx/html/fonts:ro
      - ./images:/usr/share/nginx/html/images:ro
