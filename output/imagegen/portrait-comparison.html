<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait comparison — Sergio &amp; Mandy</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 32px; background: #122227; color: #eee9d8; font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 1280px; margin: auto; }
h1 { margin: 0 0 8px; font-size: 28px; }
p { margin: 0 0 24px; color: #c3bea1; }
.portraits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
figure { margin: 0; background: #172e34; border: 1px solid #30474a; border-radius: 16px; padding: 16px; }
img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: contain; }
figcaption { margin-top: 16px; text-align: center; }
strong { display: block; font-size: 18px; }
span { color: #c3bea1; font-size: 14px; }
.new span { color: #a3d4b2; }
@media (max-width: 760px) { body { padding: 16px; } .portraits { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } figure { padding: 10px; } }
</style>
</head>
<body>
<main>
<h1>Two takes on the same portraits</h1>
<p>The original illustrations alongside the more cartoonized portraits now used on the website. Both versions are preserved.</p>
<div class="portraits">
<figure><img src="../../src/assets/images/portrait-sergio-professional.png" alt="Sergio, original illustrated portrait"><figcaption><strong>Sergio</strong><span>Original illustration</span></figcaption></figure>
<figure class="new"><img src="../../src/assets/images/portrait-sergio-cartoon.png" alt="Sergio, selected cartoon portrait"><figcaption><strong>Sergio</strong><span>More cartoonized · Selected</span></figcaption></figure>
<figure><img src="../../src/assets/images/portrait-mandy-professional.png" alt="Mandy, original illustrated portrait"><figcaption><strong>Mandy</strong><span>Original illustration</span></figcaption></figure>
<figure class="new"><img src="../../src/assets/images/portrait-mandy-cartoon.png" alt="Mandy, selected cartoon portrait"><figcaption><strong>Mandy</strong><span>More cartoonized · Selected</span></figcaption></figure>
</div>
</main>
</body>
</html>
